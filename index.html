<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dany Dat - Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top" id="brand"></a>
    <nav>
      <a href="#reel">Reel</a>
      <a href="#works">My works</a>
      <a href="#about">About me</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section id="reel" class="hero">
      <video id="reelVideo" autoplay muted loop playsinline></video>
      <div class="hero-text">
        <h1 id="reelTitle"></h1>
        <p id="tagline"></p>
      </div>
    </section>

    <section id="works">
      <h2 id="worksTitle"></h2>
      <div id="sections"></div>
    </section>

    <section id="about" class="text-block">
      <h2>ABOUT ME</h2>
      <p id="about-text"></p>
    </section>

    <section id="contact" class="text-block">
      <h2>CONTACT</h2>
      <p id="contact-text"></p>
    </section>
  </main>

  <div id="lightbox" hidden></div>
  <script src="app.js"></script>
</body>
</html>
